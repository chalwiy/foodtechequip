{
  "name": "FTE sitemap and IndexNow",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "execute": {
          "description": "Commit sitemap, rebuild Pages and notify IndexNow (false = dry-run)",
          "type": "boolean",
          "default": false
        }
      }
    },
    "schedule": [
      {
        "cron": "23 2 * * *"
      }
    ]
  },
  "permissions": {},
  "concurrency": {
    "group": "fte-seo-main",
    "cancel-in-progress": false
  },
  "jobs": {
    "maintenance": {
      "if": "github.repository == 'chalwiy/foodtechequip' && github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "write",
        "pages": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "main",
            "fetch-depth": 0
          }
        },
        {
          "name": "Regression tests",
          "run": "python3 -B -m unittest discover -s .github/tests -v"
        },
        {
          "name": "Maintain sitemap and notify eligible changes",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "EVENT_BEFORE": "${{ github.event.before }}",
            "EVENT_AFTER": "${{ github.event.after }}",
            "EXECUTE": "${{ github.event_name != 'workflow_dispatch' || inputs.execute }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\nif [ \"$EXECUTE\" = \"true\" ]; then\n  python3 -B .github/scripts/maintain.py --execute\nelse\n  python3 -B .github/scripts/maintain.py\nfi\n"
        }
      ]
    }
  }
}
